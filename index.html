<script>
'use strict';
const $=id=>document.getElementById(id),albums=[
{name:'Midnight Blue',short:'blue',artist:'After Hours Trio',color:'#244653',ink:'#e5d7bd',root:0,bpm:75,prog:[0,5,2,7],scale:[0,2,3,5,7,9,10],kind:'swing'},
{name:'Golden Coast',short:'sol',artist:'Marina & The Keys',color:'#9c7647',ink:'#f3e2c2',root:5,bpm:112,prog:[0,9,2,7],scale:[0,2,4,5,7,9,11],kind:'bossa'},
{name:'Rain on Mercer',short:'rain',artist:'Café Quartet',color:'#415554',ink:'#efddbd',root:2,bpm:67,prog:[0,9,2,7],scale:[0,2,4,5,7,9,11],kind:'ballad'},
{name:'Last Train',short:'1:14',artist:'Night Platform',color:'#4b3651',ink:'#f8d2c4',root:9,bpm:91,prog:[0,5,2,7],scale:[0,2,3,5,7,8,10],kind:'swing'},
{name:'Velvet Hour',short:'velvet',artist:'J. Monroe Ensemble',color:'#6a302f',ink:'#f9dbbb',root:7,bpm:80,prog:[0,9,5,7],scale:[0,2,4,5,7,9,10],kind:'ballad'},

{name:'Sunday in June',short:'june',artist:'Little Moon Quartet',color:'#b3976a',ink:'#251d15',root:0,bpm:98,prog:[0,9,2,7],scale:[0,2,4,5,7,9,11],kind:'bossa'},
{name:'Afterglow',short:'glow',artist:'Aster & The Room',color:'#453b5a',ink:'#e7d4cc',root:10,bpm:61,prog:[0,5,9,7],scale:[0,2,4,5,7,9,11],kind:'ballad'},
{name:'Autumn Window',short:'autumn',artist:'The Walnut Trio',color:'#8a4c31',ink:'#f2dfc1',root:4,bpm:72,prog:[0,5,2,7],scale:[0,2,4,5,7,9,11],kind:'ballad'},

function recordHTML(a,i){return '<div class="cubby"><button class="record" data-id="'+i+'" style="--cover:'+a.color+';--cover-ink:'+a.ink+'" aria-label="Take '+a.name+' by '+a.artist+'"><span class="cover-top">ORIGINAL JAZZ SESSION</span><span class="cover-title">'+a.short+'</span><span class="cover-foot">AFTER HOURS · '+String(i+1).padStart(2,'0')+'</span></button></div>'}

function pick(i,element){const a=albums[i];const rect=element.getBoundingClientRect();picked=i;stop();elapsed=0;const f=$('flying');f.innerHTML=element.innerHTML;f.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:11px;background:linear-gradient(145deg,'+a.color+',#18110e);color:'+a.ink+';left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px';f.classList.remove('moving');requestAnimationFrame(()=>requestAnimationFrame(()=>{f.classList.add('moving');f.style.left=(innerWidth*.5-45)+'px';f.style.top=(innerHeight*.69-70)+'px';f.style.width='110px';f.style.height='110px'}));whisper('You take “'+a.name+'” from the shelf…');setTimeout(()=>{f.style.display='none';showDeck();},940)}
function showDeck(){$('game').classList.add('deck-view');const a=albums[picked??0];$('recordLabel').style.background=a.color;$('recordLabel').style.color=a.ink;$('recordLabel').innerHTML='<span>'+a.short.toUpperCase()+'</span><small>33⅓ RPM</small>';$('trackTitle').textContent=a.name;$('trackSub').textContent=a.artist+' · Original instrumental sketch';$('status').textContent='AT THE TURNTABLE';whisper('Press START to lower the needle · STOP to stop playback');}
function back(){$('game').classList.remove('deck-view');whisper('Reach for another record on the wall');$('status').textContent='THE RECORD WALL';}
function initAudio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=(Number($('volume').value)/100)*.7;master.connect(ctx.destination);noiseBuffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ctx.state==='suspended')ctx.resume();}
function oscillator(freq,t,dur,type='sine',volume=.1){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,volume,cutoff){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=cutoff;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,0,dur);s.stop(t+dur)}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function rng(a,b,c){let n=(a*4381+b*731+c*1277+93)>>>0;n=(n^(n<<13))>>>0;n=(n^(n>>>17))>>>0;return ((n^(n<<5))>>>0)/4294967296}
function audioStep(s,t){const a=albums[picked??0],beat=s%4,bar=Math.floor(s/16),degree=a.prog[bar%4],root=48+a.root+degree,dur=60/a.bpm,r=rng(picked??0,bar,s);
if(beat===0){oscillator(88,t,.16,'sine',.13);oscillator(53,t,.22,'triangle',.08)}
if(a.kind==='bossa'){if(s%8===4)noise(t,.055,.022,2200);if(s%4===2)noise(t,.055,.019,7000)}else{if(s%16===4||s%16===12)noise(t,.11,.015,1300);if(s%2===0)noise(t,.033,.007,8300)}
if(s%4===0){oscillator(midi(root-12+(bar%2&&beat===0?7:0)),t,.34,'triangle',.115)}
if(s%16===0||s%16===8){[0,3,7,10].forEach((v,i)=>{oscillator(midi(root+v+12),t+i*.012,dur*(a.kind==='ballad'?2.6:1.8),'triangle',.024);oscillator(midi(root+v+24),t+i*.012,dur*1.3,'sine',.009)})}
if((s%4===2&&r>.25)||(s%8===0&&r>.81)){const idx=Math.floor(rng(s,picked??0,bar)*a.scale.length),note=60+a.root+degree+a.scale[idx]+(r>.85?12:0);oscillator(midi(note),t,dur*(.35+r*.7),'sine',.031);oscillator(midi(note),t,dur*.37,'triangle',.014)}
}
function schedule(){if(!playing||!ctx)return;const a=albums[picked??0],dur=60/a.bpm/4;while(nextTime<ctx.currentTime+.13){audioStep(step++,nextTime);nextTime+=dur}}
function start(){if(picked===null){toast('Choose a record from the wall first.');return}if(playing)return;initAudio();const a=albums[picked],dur=60/a.bpm/4;step=Math.floor(elapsed/dur);nextTime=ctx.currentTime+.055;startStamp=performance.now()/1000-elapsed;playing=true;schedule();timer=setInterval(schedule,27);$('vinyl').classList.add('spin');$('tonearm').classList.add('down');whisper('The needle is down · Press STOP to end the song')}
function stop(){if(playing)elapsed=Math.max(0,performance.now()/1000-startStamp);playing=false;clearInterval(timer);timer=null;$('vinyl').classList.remove('spin');$('tonearm').classList.remove('down')}
function next(){if(picked===null)return;stop();picked=(picked+1)%albums.length;elapsed=0;showDeck();toast('You changed the record. Press START to play.')}
$('shelf').addEventListener('click',e=>{const b=e.target.closest('.record');if(b)pick(Number(b.dataset.id),b)});
$('tableDeck').addEventListener('click',()=>{if(picked===null){toast('Choose a record from the wall first.');return}showDeck()});
$('back').addEventListener('click',back);$('startBtn').addEventListener('click',start);$('stopBtn').addEventListener('click',()=>{stop();elapsed=0;whisper('The record is stopped. Press START to listen again.')});$('liftBtn').addEventListener('click',()=>{if(playing){stop();whisper('Needle lifted · Press START to resume')}else start()});$('next').addEventListener('click',next);$('volume').addEventListener('input',e=>{if(master)master.gain.value=Number(e.target.value)/100*.7});
setInterval(()=>{$('time').textContent=String(Math.floor((playing?(performance.now()/1000-startStamp):elapsed)/60)).padStart(2,'0')+':'+String(Math.floor((playing?(performance.now()/1000-startStamp):elapsed)%60)).padStart(2,'0')},350);
if(matchMedia('(pointer:fine)').matches){const c=$('cursor');addEventListener('pointermove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';const b=e.target.closest('.record,.physical,.close-deck');c.classList.toggle('grab',!!b);if(b?.classList.contains('record')){$('status').textContent='REACH FOR '+albums[Number(b.dataset.id)].name.toUpperCase()}else if(!$('game').classList.contains('deck-view'))$('status').textContent='YOUR LISTENING ROOM'})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('game').classList.contains('deck-view'))back();if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(playing)stop();else start()}});
</script></body></html>
