name: After Hours browser smoke tests
# Manual QA until the remaining 3D browser regressions are fixed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve the static website
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/after-hours-server.log 2>&1 &
      - name: Test four viewport sizes
        run: npx playwright test tests/after-hours.spec.mjs --reporter=line --workers=1
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-hours-browser-results
          path: test-results/
          if-no-files-found: ignore
